name: Windows reference images

on:
  workflow_dispatch:
    inputs:
      max_files:
        description: Maximum missing files to attempt (1–1000)
        type: number
        default: 200

permissions:
  contents: read

concurrency:
  group: windows-references-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      missing: ${{ steps.check.outputs.missing }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: check
        run: python scripts/render-missing.py --check

  render:
    needs: preflight
    if: needs.preflight.outputs.missing == 'true'
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch shared native renderer
        uses: actions/checkout@v4
        with:
          repository: bitplane/pillow-wmf
          ref: 4e116c516ba64b31618fd89d6b2cbba0ae9c033a
          path: .oracle
          sparse-checkout: scripts/windows_wmf_render.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==12.3.0
      - name: Render missing PNGs
        env:
          MAX_FILES: ${{ inputs.max_files || 200 }}
        run: python scripts/render-missing.py --max-files "$env:MAX_FILES"
      - name: Hand off PNGs
        uses: actions/upload-artifact@v4
        with:
          name: windows-pngs
          path: corpora/**/*.png
          if-no-files-found: warn
          retention-days: 7

  commit:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Find generated images
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "windows-pngs")] | length')
          echo "exists=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.artifact.outputs.exists == 'true'
        with:
          name: windows-pngs
          path: corpora
      - name: Commit reference images
        if: steps.artifact.outputs.exists == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git add -- 'corpora/**/*.png'
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add Windows reference PNGs [skip ci]'
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
