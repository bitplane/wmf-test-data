name: Reference images

# Renders whatever sizes.txt asks for that the releases do not already have.
# Running it again does nothing. Delete a release to have it rebuilt.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: references

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The plan needs sizes.txt and the corpus names, which it reads from the
          # commit with git ls-tree. None of the metafiles have to come down.
          filter: blob:none
          sparse-checkout: |
            scripts
            sizes.txt
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/plan-references.py
      - name: Open any release that does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
          CREATE: ${{ steps.plan.outputs.create }}
        run: |
          # Up front, so parallel render jobs only ever upload.
          for tag in $(echo "$CREATE" | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)))'); do
            gh release create "$tag" --title "$tag" --notes ""
          done

  render:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: windows-2025
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: ${{ matrix.sparse }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bitplane/pillow-wmf
          ref: 4e116c516ba64b31618fd89d6b2cbba0ae9c033a
          path: .oracle
          sparse-checkout: scripts/windows_wmf_render.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==12.3.0
      - env:
          WIDTH: ${{ matrix.width }}
          HEIGHT: ${{ matrix.height }}
          CORPUS: ${{ matrix.corpora }}
        run: >
          python scripts/render-references.py
          --width "$env:WIDTH" --height "$env:HEIGHT" --corpus "$env:CORPUS" --out build
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.size }}
        run: gh release upload "$TAG" build/*.tar.gz --clobber
