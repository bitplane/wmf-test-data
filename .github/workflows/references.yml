name: Reference images

on:
  workflow_dispatch:
    inputs:
      width:
        description: Output width in pixels
        type: string
        default: '128'
      height:
        description: Output height in pixels
        type: string
        default: '128'
      corpus:
        description: Comma-separated corpus names; blank renders all
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: references-${{ inputs.width }}x${{ inputs.height }}

jobs:
  render:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bitplane/pillow-wmf
          ref: 4e116c516ba64b31618fd89d6b2cbba0ae9c033a
          path: .oracle
          sparse-checkout: scripts/windows_wmf_render.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==12.3.0
      - id: render
        env:
          WIDTH: ${{ inputs.width }}
          HEIGHT: ${{ inputs.height }}
          CORPUS: ${{ inputs.corpus }}
        run: >
          python scripts/render-references.py
          --width "$env:WIDTH" --height "$env:HEIGHT" --corpus "$env:CORPUS" --out build
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.render.outputs.size }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/*.tar.gz --clobber
          else
            gh release create "$TAG" build/*.tar.gz --title "$TAG" --notes ""
          fi
