name: Release

# Publishes the release for the version tag on this commit: the metafiles, and
# their Windows references at every size in sizes.txt. Running it again fills
# only what is missing. Tag a new version when the metafiles change.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      data: ${{ steps.plan.outputs.data }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The plan reads sizes.txt, the version tag and the corpus names from
          # the commit. None of the metafiles have to come down.
          filter: blob:none
          fetch-tags: true
          fetch-depth: 0
          sparse-checkout: |
            scripts
            sizes.txt
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/plan-references.py
      - name: Open the release if it does not exist yet
        if: steps.plan.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: gh release create "$VERSION" --title "$VERSION" --notes ""

  data:
    needs: plan
    if: needs.plan.outputs.data != '[]'
    name: metafiles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          CORPORA: ${{ needs.plan.outputs.data }}
        run: |
          mkdir -p build
          for corpus in $(echo "$CORPORA" | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)))'); do
            tar czf "build/$corpus.tar.gz" -C corpora "$corpus"
          done
          gh release upload "$VERSION" build/*.tar.gz --clobber

  render:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    # Without this the job name lists every matrix value, sparse patterns included.
    name: references ${{ matrix.size }}
    runs-on: windows-2025
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: ${{ matrix.sparse }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bitplane/pillow-wmf
          ref: f20c227b74bbb69759d94f3e31988cabf3bc8d04
          path: .oracle
          sparse-checkout: scripts/windows_wmf_render.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==12.3.0
      - env:
          WIDTH: ${{ matrix.width }}
          HEIGHT: ${{ matrix.height }}
          CORPUS: ${{ matrix.corpora }}
        run: >
          python scripts/render-references.py
          --width "$env:WIDTH" --height "$env:HEIGHT" --corpus "$env:CORPUS" --out build
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: gh release upload "$VERSION" build/*.tar.gz --clobber
